steps:
  # ── Backend: Build Docker image ────────────────────────────────────────────
  - name: "gcr.io/cloud-builders/docker"
    id: "build-backend"
    args:
      - build
      - -t
      - us-central1-docker.pkg.dev/$PROJECT_ID/amplify-interview/backend:$COMMIT_SHA
      - -t
      - us-central1-docker.pkg.dev/$PROJECT_ID/amplify-interview/backend:latest
      - ./backend

  # ── Backend: Push to Artifact Registry ────────────────────────────────────
  - name: "gcr.io/cloud-builders/docker"
    id: "push-backend"
    waitFor: ["build-backend"]
    args:
      - push
      - --all-tags
      - us-central1-docker.pkg.dev/$PROJECT_ID/amplify-interview/backend

  # ── Backend: Deploy to Cloud Run ──────────────────────────────────────────
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    id: "deploy-backend"
    waitFor: ["push-backend"]
    entrypoint: gcloud
    args:
      - run
      - deploy
      - amplify-interview-backend
      - --image=us-central1-docker.pkg.dev/$PROJECT_ID/amplify-interview/backend:$COMMIT_SHA
      - --region=us-central1
      - --platform=managed
      - --allow-unauthenticated
      - --port=8080
      - --memory=1Gi
      - --cpu=1
      - --set-env-vars=GCP_PROJECT_ID=$PROJECT_ID,GCS_BUCKET_NAME=amplify-interview-uploads,FRONTEND_URL=https://amplify-interview-e6bf5.web.app,OPENAI_API_BASE=https://openrouter.ai/api/v1,OPENAI_MODEL_DEFAULT=openai/gpt-4o-mini,OPENAI_MODEL_ADVANCED=openai/gpt-4o
      - --set-secrets=OPENAI_API_KEY=amplify-openai-api-key:latest,RESEND_API_KEY=amplify-resend-api-key:latest

  # ── Frontend: Install dependencies ────────────────────────────────────────
  - name: "node:20"
    id: "npm-install"
    entrypoint: npm
    args: [ci]

  # ── Frontend: Build React SPA ──────────────────────────────────────────────
  - name: "node:20"
    id: "npm-build"
    waitFor: ["npm-install"]
    entrypoint: npm
    args: [run, build]
    secretEnv:
      - "CLOUD_RUN_URL"
      - "FIREBASE_API_KEY"
      - "FIREBASE_AUTH_DOMAIN"
      - "FIREBASE_STORAGE_BUCKET"
      - "FIREBASE_MESSAGING_SENDER_ID"
      - "FIREBASE_APP_ID"
      - "GA4_MEASUREMENT_ID"
    env:
      # Use $$ to avoid Cloud Build substitution; values expand at runtime from secretEnv.
      - "VITE_API_URL=$$CLOUD_RUN_URL"
      - "VITE_FIREBASE_API_KEY=$$FIREBASE_API_KEY"
      - "VITE_FIREBASE_AUTH_DOMAIN=$$FIREBASE_AUTH_DOMAIN"
      - "VITE_FIREBASE_PROJECT_ID=amplify-interview-e6bf5"
      - "VITE_FIREBASE_STORAGE_BUCKET=$$FIREBASE_STORAGE_BUCKET"
      - "VITE_FIREBASE_MESSAGING_SENDER_ID=$$FIREBASE_MESSAGING_SENDER_ID"
      - "VITE_FIREBASE_APP_ID=$$FIREBASE_APP_ID"
      - "VITE_GA4_MEASUREMENT_ID=$$GA4_MEASUREMENT_ID"

  # ── Frontend: Deploy to Firebase Hosting ──────────────────────────────────
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    id: "deploy-hosting"
    waitFor: ["npm-build"]
    entrypoint: bash
    secretEnv:
      - "FIREBASE_TOKEN"
    args:
      - -c
      - |
        npm install -g firebase-tools
        # Use $$ to avoid Cloud Build substitution; expanded by bash from secretEnv.
        firebase deploy --only hosting --token "$$FIREBASE_TOKEN" --project amplify-interview-e6bf5

availableSecrets:
  secretManager:
    - versionName: projects/$PROJECT_ID/secrets/amplify-cloud-run-url/versions/latest
      env: "CLOUD_RUN_URL"
    - versionName: projects/$PROJECT_ID/secrets/amplify-firebase-api-key/versions/latest
      env: "FIREBASE_API_KEY"
    - versionName: projects/$PROJECT_ID/secrets/amplify-firebase-auth-domain/versions/latest
      env: "FIREBASE_AUTH_DOMAIN"
    - versionName: projects/$PROJECT_ID/secrets/amplify-firebase-storage-bucket/versions/latest
      env: "FIREBASE_STORAGE_BUCKET"
    - versionName: projects/$PROJECT_ID/secrets/amplify-firebase-messaging-sender-id/versions/latest
      env: "FIREBASE_MESSAGING_SENDER_ID"
    - versionName: projects/$PROJECT_ID/secrets/amplify-firebase-app-id/versions/latest
      env: "FIREBASE_APP_ID"
    - versionName: projects/$PROJECT_ID/secrets/amplify-ga4-measurement-id/versions/latest
      env: "GA4_MEASUREMENT_ID"
    - versionName: projects/$PROJECT_ID/secrets/amplify-firebase-token/versions/latest
      env: "FIREBASE_TOKEN"

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: "E2_HIGHCPU_8"
